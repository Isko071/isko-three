<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/png" href="../image/logo/Logo.png">
    <script src="./main.js" defer></script>
</head>
<body>
    <!-- Сюда JS вставляет посты -->
    <main class="posts" id="posts"></main>

    <!-- Шаблон поста: JS клонирует его для каждого поста и заполняет данными -->
    <template id="post-template">
        <article class="post">
            <header class="post-header">
                <div class="post-author">
                    <img src="./image/user.svg" alt="" class="post-avatar">
                    <div class="post-author-info">
                        <span class="post-name"></span>
                        <span class="post-username"></span>
                    </div>
                </div>
                <div class="post-company">
                    <img src="./image/company.svg" alt="" class="post-company-icon">
                    <span class="post-company-name"></span>
                </div>
                <button type="button" class="share-button">Share</button>
            </header>

            <div class="post-content">
                <h2 class="post-title"></h2>
                <p class="post-text"></p>
            </div>

            <section class="comments">
                <div class="comments-header">
                    <img src="./image/comments.svg" alt="" class="comments-icon">
                    <span>Comments</span>
                    <span class="comments-count"></span>
                </div>
                <div class="comments-list"></div>
                <button type="button" class="show-more-button">Show more</button>
            </section>
        </article>
    </template>

    <!-- Шаблон одного комментария -->
    <template id="comment-template">
        <div class="comment">
            <span class="comment-email"></span>
            <h3 class="comment-title"></h3>
            <p class="comment-text"></p>
        </div>
    </template>
</body>
</html>
